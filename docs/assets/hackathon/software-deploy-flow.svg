<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1034" viewBox="0 0 1120 1034" role="img" aria-labelledby="title desc"><title id="title">软件部署：按 7 步完成第一次看板演示</title><desc id="desc">操作设备：Windows 电脑。流程示意；命令和界面动作见下方编号步骤。。1. 安装基础环境；2. 下载源码并安装依赖；3. 填写模型密钥；4. 终端 A：启动后端；5. 终端 B：启动前端；6. 终端 C + 浏览器：连接工作台；7. 浏览器：上传样例并打开看板</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#d9a47e"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1120" height="1034" fill="#fbf8f3"/><text x="44" y="59" font-size="34" fill="#22343c" font-weight="700">软件部署：按 7 步完成第一次看板演示</text><text x="44" y="98" font-size="19" fill="#637078" font-weight="400">操作设备：Windows 电脑。流程示意；命令和界面动作见下方编号步骤。</text><path d="M 72 209 L 72 239" stroke="#d9a47e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="72" cy="185" r="25" fill="#e87836"/><text x="65" y="193" font-size="24" fill="#fff" font-weight="700">1</text><rect x="116" y="142" width="960" height="101" rx="14" fill="#fff" stroke="#e4ded4"/><text x="139" y="172" font-size="23" fill="#22343c" font-weight="700">安装基础环境</text><text x="139" y="201" font-size="18" fill="#455760" font-weight="400">Git + Node.js 24.15.0 + npm 11.12.1；安装后重新打开 PowerShell</text><text x="139" y="227" font-size="18" fill="#976037" font-weight="400">完成标志：git / node / npm 均可输出版本</text><path d="M 72 327 L 72 357" stroke="#d9a47e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="72" cy="303" r="25" fill="#e87836"/><text x="65" y="311" font-size="24" fill="#fff" font-weight="700">2</text><rect x="116" y="260" width="960" height="101" rx="14" fill="#fff" stroke="#e4ded4"/><text x="139" y="290" font-size="23" fill="#22343c" font-weight="700">下载源码并安装依赖</text><text x="139" y="319" font-size="18" fill="#455760" font-weight="400">克隆到用户 Projects 目录，执行 npm ci，复制两份配置文件</text><text x="139" y="345" font-size="18" fill="#976037" font-weight="400">完成标志：项目根目录中已有 .env 与 harness.config.json</text><path d="M 72 445 L 72 475" stroke="#d9a47e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="72" cy="421" r="25" fill="#e87836"/><text x="65" y="429" font-size="24" fill="#fff" font-weight="700">3</text><rect x="116" y="378" width="960" height="101" rx="14" fill="#fff" stroke="#e4ded4"/><text x="139" y="408" font-size="23" fill="#22343c" font-weight="700">填写模型密钥</text><text x="139" y="437" font-size="18" fill="#455760" font-weight="400">编辑 .env，填写自己的 API Key 并保存</text><text x="139" y="463" font-size="18" fill="#976037" font-weight="400">完成标志：模型配置已保存；网关 token 留空自动生成</text><path d="M 72 563 L 72 593" stroke="#d9a47e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="72" cy="539" r="25" fill="#e87836"/><text x="65" y="547" font-size="24" fill="#fff" font-weight="700">4</text><rect x="116" y="496" width="960" height="101" rx="14" fill="#fff" stroke="#e4ded4"/><text x="139" y="526" font-size="23" fill="#22343c" font-weight="700">终端 A：启动后端</text><text x="139" y="555" font-size="18" fill="#455760" font-weight="400">在项目根目录运行 npm run dev，并保持终端运行</text><text x="139" y="581" font-size="18" fill="#976037" font-weight="400">完成标志：网关启动于 http://127.0.0.1:3000</text><path d="M 72 681 L 72 711" stroke="#d9a47e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="72" cy="657" r="25" fill="#e87836"/><text x="65" y="665" font-size="24" fill="#fff" font-weight="700">5</text><rect x="116" y="614" width="960" height="101" rx="14" fill="#fff" stroke="#e4ded4"/><text x="139" y="644" font-size="23" fill="#22343c" font-weight="700">终端 B：启动前端</text><text x="139" y="673" font-size="18" fill="#455760" font-weight="400">在项目根目录运行 npm run dev:web，并保持终端运行</text><text x="139" y="699" font-size="18" fill="#976037" font-weight="400">完成标志：浏览器能打开 http://127.0.0.1:5177</text><path d="M 72 799 L 72 829" stroke="#d9a47e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="72" cy="775" r="25" fill="#e87836"/><text x="65" y="783" font-size="24" fill="#fff" font-weight="700">6</text><rect x="116" y="732" width="960" height="101" rx="14" fill="#fff" stroke="#e4ded4"/><text x="139" y="762" font-size="23" fill="#22343c" font-weight="700">终端 C + 浏览器：连接工作台</text><text x="139" y="791" font-size="18" fill="#455760" font-weight="400">查看 token → 设置网关地址与 token → 连接 → 发送问候</text><text x="139" y="817" font-size="18" fill="#976037" font-weight="400">完成标志：连接成功，且收到模型正常回复</text><circle cx="72" cy="893" r="25" fill="#e87836"/><text x="65" y="901" font-size="24" fill="#fff" font-weight="700">7</text><rect x="116" y="850" width="960" height="101" rx="14" fill="#fff" stroke="#e4ded4"/><text x="139" y="880" font-size="23" fill="#22343c" font-weight="700">浏览器：上传样例并打开看板</text><text x="139" y="909" font-size="18" fill="#455760" font-weight="400">上传 judge-sales.csv → 确认需求 → 等待发布 → 任务中打开</text><text x="139" y="935" font-size="18" fill="#976037" font-weight="400">完成标志：全部 6 条记录；销售 800 元、成本 500 元、毛利 300 元</text><text x="44" y="1003" font-size="18" fill="#637078" font-weight="400">完成后再按需接入真实商户账号或手机硬件。样例数据为虚构数据。</text></g></svg>
