[package]
name = "qdd-android-mcp-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false
license = "MIT"
description = "Native Android LAN screen and ESP32 HID MCP bridge"

[dependencies]
anyhow = "=1.0.97"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
base64 = "=0.22.1"
sha2 = "=0.10.8"
httparse = "=1.10.1"
tungstenite = { version = "=0.26.2", default-features = false, features = ["handshake"] }
serialport = { version = "=4.7.3", default-features = false }
image = { version = "=0.25.6", default-features = false, features = ["jpeg", "png"] }
flate2 = "=1.1.10"
tokio = { version = "=1.44.2", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-util = { version = "=0.7.14", features = ["rt"] }
socket2 = { version = "=0.5.9", features = ["all"] }
if-addrs = "=0.13.4"
uuid = { version = "=1.16.0", features = ["v4"] }
ctrlc = "=3.4.6"
native-tls = "=0.2.14"

[target.'cfg(windows)'.dev-dependencies]
schannel = "=0.1.30"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
incremental = false
