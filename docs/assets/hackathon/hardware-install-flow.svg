<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1220" viewBox="0 0 1120 1220" role="img" aria-labelledby="title desc"><title id="title">手机硬件安装：先烧录，再配网与安装</title><desc id="desc">操作设备分开标明。流程示意；不是设备截图或实机验收记录。。1. 电脑 + 控制板：首次烧录；2. 控制板：连接无线网；3. 手机：下载并安装 App；4. 手机 + 控制板：确认蓝牙配对；5. 手机：开始屏幕共享；6. 电脑：启动设备操作台；7. 电脑：接入主工作台；8. 手机 + 控制板：完成操作核对</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#d9a47e"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1120" height="1220" fill="#fbf8f3"/><text x="44" y="59" font-size="34" fill="#22343c" font-weight="700">手机硬件安装：先烧录，再配网与安装</text><text x="44" y="98" font-size="19" fill="#637078" font-weight="400">操作设备分开标明。流程示意；不是设备截图或实机验收记录。</text><rect x="44" y="122" width="1032" height="58" rx="12" fill="#fff0df" stroke="#edc69e"/><text x="65" y="158" font-size="20" fill="#8d4a21" font-weight="600">前提：已按环境指南构建 APK、Windows ZIP、USB 资源与完整固件 full.bin。</text><path d="M 72 277 L 72 307" stroke="#d9a47e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="72" cy="253" r="25" fill="#e87836"/><text x="65" y="261" font-size="24" fill="#fff" font-weight="700">1</text><rect x="116" y="210" width="960" height="101" rx="14" fill="#fff" stroke="#e4ded4"/><text x="139" y="240" font-size="23" fill="#22343c" font-weight="700">电脑 + 控制板：首次烧录</text><text x="139" y="269" font-size="18" fill="#455760" font-weight="400">连接数据线，确认实际 COM 口，将匹配 full.bin 写入 0x0</text><text x="139" y="295" font-size="18" fill="#976037" font-weight="400">完成标志：烧录校验通过，控制板重启并显示连接引导</text><path d="M 72 395 L 72 425" stroke="#d9a47e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="72" cy="371" r="25" fill="#e87836"/><text x="65" y="379" font-size="24" fill="#fff" font-weight="700">2</text><rect x="116" y="328" width="960" height="101" rx="14" fill="#fff" stroke="#e4ded4"/><text x="139" y="358" font-size="23" fill="#22343c" font-weight="700">控制板：连接无线网</text><text x="139" y="387" font-size="18" fill="#455760" font-weight="400">选择 2.4 GHz Wi-Fi；电脑和手机加入允许互访的同一局域网</text><text x="139" y="413" font-size="18" fill="#976037" font-weight="400">完成标志：板上显示真实 IP 和 http://&lt;控制板IP&gt;:3334/</text><path d="M 72 513 L 72 543" stroke="#d9a47e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="72" cy="489" r="25" fill="#e87836"/><text x="65" y="497" font-size="24" fill="#fff" font-weight="700">3</text><rect x="116" y="446" width="960" height="101" rx="14" fill="#fff" stroke="#e4ded4"/><text x="139" y="476" font-size="23" fill="#22343c" font-weight="700">手机：下载并安装 App</text><text x="139" y="505" font-size="18" fill="#455760" font-weight="400">打开板上安装页 → 下载 Android 手机版 → 完成 APK 安装</text><text x="139" y="531" font-size="18" fill="#976037" font-weight="400">完成标志：已安装“设备投屏”，能打开目标控制板引导</text><path d="M 72 631 L 72 661" stroke="#d9a47e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="72" cy="607" r="25" fill="#e87836"/><text x="65" y="615" font-size="24" fill="#fff" font-weight="700">4</text><rect x="116" y="564" width="960" height="101" rx="14" fill="#fff" stroke="#e4ded4"/><text x="139" y="594" font-size="23" fill="#22343c" font-weight="700">手机 + 控制板：确认蓝牙配对</text><text x="139" y="623" font-size="18" fill="#455760" font-weight="400">按板上引导打开配对窗口，在手机系统蓝牙设置选择对应设备</text><text x="139" y="649" font-size="18" fill="#976037" font-weight="400">完成标志：双方显示连接就绪；配对无需手输数字</text><path d="M 72 749 L 72 779" stroke="#d9a47e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="72" cy="725" r="25" fill="#e87836"/><text x="65" y="733" font-size="24" fill="#fff" font-weight="700">5</text><rect x="116" y="682" width="960" height="101" rx="14" fill="#fff" stroke="#e4ded4"/><text x="139" y="712" font-size="23" fill="#22343c" font-weight="700">手机：开始屏幕共享</text><text x="139" y="741" font-size="18" fill="#455760" font-weight="400">回到设备投屏 App → 开始投屏 → 本人确认系统共享授权</text><text x="139" y="767" font-size="18" fill="#976037" font-weight="400">完成标志：手机 App 显示正在投屏，并给出画面服务地址</text><path d="M 72 867 L 72 897" stroke="#d9a47e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="72" cy="843" r="25" fill="#e87836"/><text x="65" y="851" font-size="24" fill="#fff" font-weight="700">6</text><rect x="116" y="800" width="960" height="101" rx="14" fill="#fff" stroke="#e4ded4"/><text x="139" y="830" font-size="23" fill="#22343c" font-weight="700">电脑：启动设备操作台</text><text x="139" y="859" font-size="18" fill="#455760" font-weight="400">下载 Windows ZIP → 全部解压缩 → 运行 EXE（端口 8792）→ 查找设备</text><text x="139" y="885" font-size="18" fill="#976037" font-weight="400">完成标志：操作台出现持续更新的手机画面</text><path d="M 72 985 L 72 1015" stroke="#d9a47e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="72" cy="961" r="25" fill="#e87836"/><text x="65" y="969" font-size="24" fill="#fff" font-weight="700">7</text><rect x="116" y="918" width="960" height="101" rx="14" fill="#fff" stroke="#e4ded4"/><text x="139" y="948" font-size="23" fill="#22343c" font-weight="700">电脑：接入主工作台</text><text x="139" y="977" font-size="18" fill="#455760" font-weight="400">把实际电脑 IP 的 :8792/mcp 写入 harness.config.json，重启后端</text><text x="139" y="1003" font-size="18" fill="#976037" font-weight="400">完成标志：自定义 MCP 工具加载，模型能请求手机截图</text><circle cx="72" cy="1079" r="25" fill="#e87836"/><text x="65" y="1087" font-size="24" fill="#fff" font-weight="700">8</text><rect x="116" y="1036" width="960" height="101" rx="14" fill="#fff" stroke="#e4ded4"/><text x="139" y="1066" font-size="23" fill="#22343c" font-weight="700">手机 + 控制板：完成操作核对</text><text x="139" y="1095" font-size="18" fill="#455760" font-weight="400">在测试界面核对点击、中文输入、Esc 退出和板上物理急停</text><text x="139" y="1121" font-size="18" fill="#976037" font-weight="400">完成标志：画面与实际输入一致，急停后停止输入</text><text x="44" y="1189" font-size="18" fill="#637078" font-weight="400">图中的 IP / COM 口需替换为自己的实际值；手机操作需要图片模型和本人系统授权。</text></g></svg>
