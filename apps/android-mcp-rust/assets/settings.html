<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备操作台 · 连接设置</title>
<style>body{font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif;background:#0e1116;color:#f3f4f6;margin:0;padding:40px 20px}main{max-width:540px;margin:auto;background:#191d24;border:1px solid #303640;border-radius:18px;padding:30px}h1{margin:0 0 8px;font-size:26px}p{color:#a8afbb}label{display:block;margin:20px 0 6px}input,select,button{box-sizing:border-box;width:100%;padding:12px;border-radius:9px;border:1px solid #3b424e;font:inherit;background:#12161c;color:#fff}button{margin-top:26px;background:#d4380d;border:0;font-weight:600;cursor:pointer}small{display:block;color:#929ba8;margin-top:6px}#message{color:#f9c56a;white-space:pre-wrap}section,details{background:#12161c;border:1px solid #303640;border-radius:12px;padding:14px;margin-top:16px}section label:first-child{margin-top:0}#find{background:#232831;border:1px solid #3b424e}button:hover{filter:brightness(1.08)}section[hidden]{display:none}</style>
<main><h1>设备操作台</h1><p>手机打开设备投屏，连接设备控制器并允许共享屏幕。手机、控制器和电脑需要在同一局域网。</p><form id="form">
<button id="find" type="button">自动查找手机与设备控制器</button><p id="discovery-state" role="status"></p><select id="boards" aria-label="选择找到的设备控制器" hidden></select>
<label for="screen">手机投屏地址</label><input id="screen" placeholder="192.168.1.20:8791" required autocomplete="off"><small>填写手机 App 显示的地址。</small>
<label for="mode">设备控制器怎样连接电脑</label><select id="mode"><option value="wifi">Wi-Fi 内网连接</option><option value="usb">USB 数据线</option></select>
<section id="wifi"><label for="host">设备控制器内网 IP</label><input id="host" placeholder="IP、IP:3333 或扫码页地址" autocomplete="off"><small>在设备控制器的设置中连接无线网络，再填写设备显示的 IP。控制端口默认 3333；3334 是扫码下载页端口，粘贴后会自动改为控制端口 3333。地址内的端口优先于下方端口。</small><label for="tcp">设备控制器端口</label><input id="tcp" type="number" min="1" max="65535" value="3333"></section>
<section id="usb" hidden><label for="serial">设备控制器 USB 串口</label><select id="serial"></select></section>
<details><summary>高级设置</summary><label for="local-port">操作台 / MCP 端口</label><input id="local-port" type="number" min="1" max="65535" value="8790"><small>端口被其他程序占用时，可改为另一个端口。</small></details>
<button id="save" type="submit">保存并打开操作台</button><p id="message" role="status"></p></form><small>手机仍通过内网投屏；USB 选项只连接设备控制器。MCP 地址：<span id="mcp-address"></span></small></main>
<script>
const data=__QDD_SETTINGS_DATA__;const get=id=>document.getElementById(id);
const normalizeControllerAddress=function normalizeControllerAddress(value, portValue = 3333) {
  const address = String(value ?? "").trim().replaceAll("：", ":");
  let host = address;
  let embeddedPort;
  if (address.includes(":") || address.includes("/")) {
    const match = /^(?:http:\/\/)?(\d+\.\d+\.\d+\.\d+)(?::(\d+))?\/?$/.exec(address);
    if (!match) throw new Error("设备控制器地址应为内网 IP、IP:端口或扫码下载页地址，不含账号或页面路径。");
    host = match[1];
    embeddedPort = match[2];
  }
  const parts = host.split(".");
  const ipv4 = parts.length === 4 && parts.every((part) => /^(?:0|[1-9]\d{0,2})$/.test(part) && Number(part) <= 255);
  const octets = parts.map(Number);
  const privateIp = ipv4 && (octets[0] === 10 || octets[0] === 127 || (octets[0] === 192 && octets[1] === 168)
    || (octets[0] === 172 && octets[1] >= 16 && octets[1] <= 31));
  const hostname = !address.includes(":") && !address.includes("/") && !/^[\d.]+$/.test(host) && host.length <= 253
    && parts.every((label) => /^[a-z\d](?:[a-z\d-]{0,61}[a-z\d])?$/i.test(label));
  if (host && !privateIp && !hostname) throw new Error("设备控制器地址请填写内网 IPv4 地址或局域网主机名。");
  let tcpPort = Number(embeddedPort ?? portValue);
  if (!Number.isInteger(tcpPort) || tcpPort < 1 || tcpPort > 65535) throw new Error("设备控制器端口应为 1 到 65535 之间的整数。");
  // 3334 serves the QR installation page, never the control protocol.
  if (tcpPort === 3334) tcpPort = 3333;
  return { host, tcpPort };
};
get("mcp-address").textContent=data.mcpUrl;
let touched=false,modeChosen=false,found=[],editRevision=0,saving=false,finding=false;
async function requestJson(url,options={},timeoutMs=6000){const controller=new AbortController();let timer;try{return await Promise.race([(async()=>{const response=await fetch(url,{...options,signal:controller.signal});return{response,result:await response.json()}})(),new Promise((_,reject)=>{timer=setTimeout(()=>{const error=Error("连接等待超时，请检查 Wi-Fi 后重试；保存结果尚未确认时可重新打开操作台。");reject(error);controller.abort(error)},timeoutMs)})])}finally{clearTimeout(timer)}}
function savingState(active){for(const id of ["save","screen","host","tcp","mode","serial","local-port","boards"])get(id).disabled=active;get("find").disabled=active||finding}
get("screen").value=data.defaults.ANDROID_SCREEN_URL||"";get("host").value=data.defaults.ESP_HOST||"";get("tcp").value=data.defaults.ESP_TCP_PORT||3333;get("local-port").value=data.defaults.ANDROID_MCP_PORT||8790;get("mode").value=Object.hasOwn(data.defaults,"ESP_HOST")&&data.defaults.ESP_HOST===""&&data.defaults.ESP_PORT?"usb":"wifi";get("message").textContent=data.problem;
const ports=[...new Set([data.defaults.ESP_PORT||"COM5",...data.ports])];for(const port of ports){const option=document.createElement("option");option.value=option.textContent=port;get("serial").append(option)}
function mode(){get("wifi").hidden=get("mode").value!=="wifi";get("usb").hidden=!get("wifi").hidden;get("host").required=!get("wifi").hidden}get("mode").onchange=()=>{touched=true;modeChosen=true;editRevision++;mode()};mode();
for(const id of ["screen","host","tcp","serial","local-port"])get(id).oninput=()=>{touched=true;editRevision++;if(id==="screen")data.defaults.ANDROID_DEVICE_ID="";if(id==="host")data.defaults.ESP_SETUP_URL=""};
function choose(board,manual=false){if(!board||saving)return;get("host").value=board.ip;get("tcp").value=board.tcpPort;if(board.phone){get("screen").value=board.phone.screenUrl;data.defaults.ANDROID_DEVICE_ID=board.phone.deviceId}data.defaults.ESP_SETUP_URL=board.boardUrl;if(manual&&!modeChosen){get("mode").value="wifi";mode()}get("discovery-state").textContent=board.phone?(board.phone.projecting?"已找到手机和设备控制器。确认后点击保存即可。":"已找到手机和设备控制器。请在手机上开始投屏，再保存连接。"):(get("screen").value?"已找到设备控制器，保留已填写的手机投屏地址。确认手机仍在投屏后即可保存。":"已找到设备控制器。请先在手机 App 连接它，再自动查找，或填写手机投屏地址。")}
get("boards").onchange=()=>{if(get("boards").value!==""){touched=true;editRevision++;choose(found[Number(get("boards").value)],true)}};
async function find(automatic=false){if(saving||finding)return;finding=true;const revision=editRevision;const button=get("find");button.disabled=true;get("discovery-state").textContent="正在同一 Wi-Fi 内查找…";try{const{response,result}=await requestJson("__QDD_DISCOVER_PATH__",{cache:"no-store"});if(!response.ok)throw Error();found=Array.isArray(result.boards)?result.boards:[];get("boards").replaceChildren();get("boards").hidden=found.length<2;if(!found.length){get("discovery-state").textContent="暂时没有找到。请让手机、设备控制器和电脑连接同一 Wi-Fi，并在手机 App 连接设备控制器。也可以手动填写地址。";return}const placeholder=document.createElement("option");placeholder.value="";placeholder.textContent="请选择找到的设备控制器";get("boards").append(placeholder);found.forEach((board,index)=>{const option=document.createElement("option");option.value=String(index);option.textContent=board.name+" · "+board.ip;get("boards").append(option)});if(found.length===1&&revision===editRevision&&(!automatic||!touched))choose(found[0],!automatic);else{get("boards").hidden=false;get("discovery-state").textContent="已找到设备控制器，请选择要连接的设备。"}}catch{get("discovery-state").textContent="暂时无法自动查找，可以稍后重试或手动填写地址。"}finally{finding=false;button.disabled=saving}}
get("find").onclick=()=>void find();if(!data.defaults.ANDROID_SCREEN_URL)void find(true);
get("form").onsubmit=async e=>{e.preventDefault();if(saving)return;if(get("mode").value==="wifi"&&!get("host").value.trim()){get("message").textContent="请填写设备控制器连接 Wi-Fi 后显示的 IP，端口默认 3333。";return}saving=true;editRevision++;savingState(true);get("message").textContent="正在保存并启动…";try{if(get("mode").value==="wifi"){const address=normalizeControllerAddress(get("host").value,get("tcp").value);get("host").value=address.host;get("tcp").value=address.tcpPort}const{response,result}=await requestJson("__QDD_SAVE_PATH__",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...data.defaults,ANDROID_SCREEN_URL:get("screen").value,ESP_HOST:get("mode").value==="wifi"?get("host").value:"",ESP_PORT:get("serial").value,ESP_TCP_PORT:get("tcp").value,ANDROID_MCP_PORT:get("local-port").value})});if(!response.ok)throw Error(result.error||"保存失败");if(result.restart){get("message").textContent="已保存，正在重新连接操作台…";let ready=false;const deadline=performance.now()+20000;for(let attempt=0;attempt<80&&performance.now()<deadline;attempt++){try{const{response:statusResponse,result:state}=await requestJson(new URL("desktop/status",result.url),{cache:"no-store"},Math.max(1,Math.min(1000,deadline-performance.now())));if(statusResponse.ok&&state.desktopConfigHash===result.configHash){ready=true;break}}catch{}const remaining=deadline-performance.now();if(remaining>0)await new Promise(done=>setTimeout(done,Math.min(250,remaining)))}if(!ready)throw Error("新操作台尚未就绪，请重新双击 EXE。")}location.href=result.url}catch(error){get("message").textContent=error.name==="TypeError"?"网络连接中断，请检查 Wi-Fi 后重试；保存结果尚未确认时可重新打开操作台。":error.message}finally{saving=false;savingState(false)}}
</script></html>
